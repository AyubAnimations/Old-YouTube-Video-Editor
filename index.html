<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube - 2015 Edition</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Top Header Navigation -->
  <header class="yt-header">
    <div class="header-left">
      <button class="guide-button" id="toggle-sidebar">
        <span></span><span></span><span></span>
      </button>
      <a href="#" class="logo">
        <span class="logo-red">YouTube</span>
        <span class="country-code">US</span>
      </a>
    </div>

    <div class="header-center">
      <form class="search-form" onsubmit="event.preventDefault();">
        <input type="text" placeholder="Search" class="search-input">
        <button type="submit" class="search-btn">
          <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        </button>
      </form>
    </div>

    <div class="header-right">
      <button class="upload-btn">Upload</button>
      <button class="sign-in-btn">Sign in</button>
    </div>
  </header>

  <!-- App Layout Container -->
  <div class="app-container">

    <!-- Left Sidebar / Guide -->
    <aside class="sidebar" id="sidebar">
      <ul class="nav-section">
        <li class="active"><a href="#">Home</a></li>
        <li><a href="#">My Channel</a></li>
        <li><a href="#">Subscriptions</a></li>
        <li><a href="#">History</a></li>
        <li><a href="#">Watch Later</a></li>
      </ul>
      <div class="divider"></div>
      <div class="sidebar-heading">BEST OF YOUTUBE</div>
      <ul class="nav-section">
        <li><a href="#">Music</a></li>
        <li><a href="#">Sports</a></li>
        <li><a href="#">Gaming</a></li>
        <li><a href="#">News</a></li>
      </ul>
    </aside>

    <!-- Main Video Feed -->
    <main class="content-area">
      <div class="feed-header">
        <h2>What to Watch</h2>
      </div>

      <section class="video-grid" id="video-grid">
        <!-- Dynamically populated via JS -->
      </section>
    </main>

  </div>

  <script src="app.js"></script>
</body>
</html>
